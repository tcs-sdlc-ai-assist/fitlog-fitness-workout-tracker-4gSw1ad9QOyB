{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-16rem)] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary-100">
                <svg class="h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
            </div>
            <h2 class="mt-6 text-3xl font-bold tracking-tight text-gray-900">Sign in to FitLog</h2>
            <p class="mt-2 text-sm text-gray-600">
                Track your workouts and crush your goals
            </p>
        </div>

        <!-- Error message -->
        {% if error %}
        <div class="rounded-md bg-red-50 border border-red-200 p-4" role="alert">
            <div class="flex items-center">
                <svg class="h-5 w-5 text-red-400 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
                <p class="text-sm font-medium text-red-800">{{ error }}</p>
            </div>
        </div>
        {% endif %}

        <!-- Login Form -->
        <div class="bg-white shadow-lg rounded-xl p-6 sm:p-8 border border-gray-100">
            <form method="POST" action="/auth/login" class="space-y-6" data-validate>
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        placeholder="Enter your username"
                        value="{{ username if username else '' }}"
                        class="block w-full rounded-lg border border-gray-300 px-4 py-3 min-h-[44px] text-gray-900 placeholder-gray-400 shadow-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500 focus:outline-none sm:text-sm transition-colors duration-200"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter your password"
                        class="block w-full rounded-lg border border-gray-300 px-4 py-3 min-h-[44px] text-gray-900 placeholder-gray-400 shadow-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500 focus:outline-none sm:text-sm transition-colors duration-200"
                    >
                </div>

                <!-- Submit Button -->
                <div>
                    <button
                        type="submit"
                        class="flex w-full justify-center rounded-lg bg-primary-600 px-4 py-3 min-h-[44px] text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors duration-200"
                    >
                        Sign in
                    </button>
                </div>
            </form>
        </div>

        <!-- Register Link -->
        <p class="text-center text-sm text-gray-600">
            Don't have an account?
            <a href="/auth/register" class="font-semibold text-primary-600 hover:text-primary-500 transition-colors duration-200">
                Create one now
            </a>
        </p>
    </div>
</div>
{% endblock %}
